[package]
name = "dredge"
version = "0.4.3"
edition = "2024"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }
anyhow = "1.0.102"
octocrab = "0.51.0"
regex = "1.12.3"
reqwest = { version = "0.13.4", features = ["stream"] }
sha2 = "0.11.0"
shell-words = "1.1.1"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
futures-util = "0.3.32"
hex = "0.4.3"
clap = { version = "4.6.1", features = ["derive"] }
chrono = "0.4.44"
bytes = "1.11.1"
